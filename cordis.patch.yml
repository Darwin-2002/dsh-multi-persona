# dsh-multi-persona 的 bundle 补丁层：把本插件作为一行插进 profile 的条目列表。
#
# 曾用名 dsh-persona-router（2026-11-10 改名）。内部仍大量沿用 persona-router：
# 路由前缀 /persona-router、数据目录 <DSH_HOME>/persona-router、上下文段名 persona-router:*。
# 那些是历史包袱，不影响使用；改它们要迁移状态，所以留着。
#
# name 必须是【裸包名】。dsh-web 的客户端模块扫描只解析裸包名行，
# 靠这一行找到本包的 package.json、读到 dsh.client，才会把 client.js 服务给网页。
- insert:
    - id: multi-persona
      name: dsh-multi-persona
